[package]
name = "earkey-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
earkey-engine = { path = "../earkey-engine" }
earkey-policy = { path = "../earkey-policy" }
earkey-supervisor = { path = "../earkey-supervisor" }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "=0.2.191"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dev-dependencies]
libc = "=0.2.191"
